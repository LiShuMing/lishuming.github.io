<!DOCTYPE HTML>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="{{ .Site.Params.author }}" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Params.author }}{{ end }}</title>
    <link rel="shortcut icon" href="/lsm.ico">

    <link rel="stylesheet" type="text/css" href="/assets/css/layout.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/style.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/highlight.css">

    <script type="text/javascript" src="/media/js/jquery-1.7.1.min.js"></script>
    {{ block "extra_head" . }}{{ end }}
  </head>
  <body>
    <div id="container">
      <div id="main" role="main">
        <header class="site-header">
          <div class="brand">
            <h1><a href="/" class="sitename" rel="home" title="返回首页">{{ .Site.Title }}</a></h1>
            <p id="description">{{ .Site.Params.description }}</p>
          </div>
          <nav aria-label="主导航">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}" class="navigator" title="{{ .Name }}">{{ .Name }}</a>
            {{ end }}
          </nav>
        </header>

        <article class="content">
        {{ block "main" . }}{{ end }}
        </article>
      </div>

      <footer>
        <p><small>Powered by <a href="https://gohugo.io/">Hugo</a> · Copyright 2013.11.11 – {{ now.Format "2006.01.02" }} by <a href="/about/">{{ .Site.Params.author }}</a></small></p>
      </footer>
    </div>
  </body>
</html>
