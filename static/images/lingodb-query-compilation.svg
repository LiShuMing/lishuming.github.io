<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">LingoDB 查询编译：逐层暴露计算与状态</title>
  <desc id="desc">SQL 依次经过关系优化、子操作和状态特化、执行步骤与并行化、控制流及 LLVM，成为查询专用机器码。生成代码仍调用数据源、内存管理、索引构建和合并等运行时功能。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#456b86"/></marker>
  </defs>
  <rect width="1120" height="650" rx="16" fill="#f8fafc"/>
  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="40" y="48" font-size="25" font-weight="700" fill="#19364d">LingoDB：把关系运算逐步改写为查询专用程序</text>
    <text x="40" y="78" font-size="15" fill="#536779">算法、状态和并行边界主要在 LLVM 之前决定；运行时继续承担通用工作。</text>
    <g fill="#fff" stroke="#b9cedd" stroke-width="1.5">
      <rect x="40" y="112" width="660" height="78" rx="10"/>
      <rect x="40" y="215" width="660" height="78" rx="10"/>
      <rect x="40" y="318" width="660" height="78" rx="10"/>
      <rect x="40" y="421" width="660" height="78" rx="10"/>
      <rect x="40" y="524" width="660" height="78" rx="10" fill="#edf7f4" stroke="#79aa9a"/>
    </g>
    <g font-size="19" font-weight="700" fill="#19364d">
      <text x="62" y="143">1  SQL → RelAlg：关系语义</text>
      <text x="62" y="246">2  SubOperator：数据流与状态</text>
      <text x="62" y="349">3  ExecutionStep：依赖与并行</text>
      <text x="62" y="452">4  控制流：循环、分支和字段访问</text>
      <text x="62" y="555">5  LLVM → 查询专用机器码</text>
    </g>
    <g font-size="15" fill="#536779">
      <text x="62" y="171">过滤下推、Join 顺序、聚合简化、实现选择</text>
      <text x="62" y="274">Map / MultiMap → 哈希结构；Lookup / Reduce / Gather</text>
      <text x="62" y="377">构建先于探测；线程本地片段；显式 Merge</text>
      <text x="62" y="480">相邻计算可进入同一生成路径；保留运行时调用</text>
      <text x="62" y="583">优化数值与控制流，执行生成函数</text>
    </g>
    <g stroke="#456b86" stroke-width="2" marker-end="url(#arrow)">
      <path d="M370 192 V210"/><path d="M370 295 V313"/>
      <path d="M370 398 V416"/><path d="M370 501 V519"/>
    </g>
    <rect x="768" y="215" width="312" height="284" rx="12" fill="#edf3f8" stroke="#b9cedd" stroke-width="1.5"/>
    <text x="790" y="250" font-size="20" font-weight="700" fill="#19364d">预编译 Runtime</text>
    <g font-size="16" fill="#536779">
      <text x="790" y="291">数据源与扫描调度</text>
      <text x="790" y="328">内存分配、缓冲区</text>
      <text x="790" y="365">哈希索引构建</text>
      <text x="790" y="402">分区合并、排序和输出</text>
      <text x="790" y="463" font-size="14">与生成代码协作执行</text>
    </g>
    <path d="M702 461 H760" fill="none" stroke="#456b86" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="792" y="556" font-size="15" fill="#536779">图示为默认 CPU 路径。</text>
    <text x="792" y="583" font-size="15" fill="#536779">不表示全部逻辑内联为一个函数。</text>
    <text x="40" y="632" font-size="13" fill="#657889">源码基准：fab813e87b94 · Execution.cpp / RelAlgToSubOp / SubOpToControlFlow / LLVMBackends.cpp</text>
  </g>
</svg>
