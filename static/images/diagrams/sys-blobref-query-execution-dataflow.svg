<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" lang="zh-CN" aria-labelledby="title desc">
  <title id="title">BlobRef 端到端查询流转架构：瘦 Shuffle、倾斜治理、异步合并预取与 GPU 喂料闭环</title>
  <desc id="desc">展示一条包含多模态大对象的 SQL 或 Python 查询如何通过控制面瘦 Shuffle、字节加权切分与大小文件倾斜治理、异步合并预取与多级本地缓存、按字节配额的有界背压，最终稳定驱动 CPU 解码池与 GPU 推理池。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .zone-ctrl { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .zone-data { fill: #ffffff; stroke: #059669; stroke-width: 1.6; rx: 10; }
      .zone-gpu { fill: #ffffff; stroke: #7c3aed; stroke-width: 1.6; rx: 10; }
      .hdr-b { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13.5px; font-weight: 700; fill: #1d4ed8; }
      .hdr-g { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13.5px; font-weight: 700; fill: #047857; }
      .hdr-p { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13.5px; font-weight: 700; fill: #6d28d9; }
      .t-h { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .t-s { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 10.6px; fill: #334155; }
      .t-m { font-family: "JetBrains Mono", Menlo, monospace; font-size: 10.2px; font-weight: 600; fill: #0f172a; }
      .t-tag-b { font-family: "JetBrains Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #1d4ed8; }
      .t-tag-g { font-family: "JetBrains Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #047857; }
      .t-tag-o { font-family: "JetBrains Mono", Menlo, monospace; font-size: 10px; font-weight: 700; fill: #b45309; }
      .card-b { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.3; rx: 8; }
      .card-g { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.3; rx: 8; }
      .card-o { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.3; rx: 8; }
      .card-p { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.3; rx: 8; }
      .card-s { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.2; rx: 8; }
      .arr-b { stroke: #2563eb; stroke-width: 1.8; fill: none; }
      .arr-g { stroke: #059669; stroke-width: 1.8; fill: none; }
      .arr-p { stroke: #7c3aed; stroke-width: 1.8; fill: none; }
      .arr-bp { stroke: #d97706; stroke-width: 1.6; stroke-dasharray: 5 3; fill: none; }
      .pill { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.1; rx: 6; }
    </style>
    <marker id="m-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="m-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="m-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="m-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1120" height="620" class="bg"/>

  <!-- ZONE 1: Control Plane (Narrow Ref Flow) -->
  <rect x="20" y="18" width="1080" height="174" class="zone-ctrl"/>
  <text x="38" y="42" class="hdr-b">阶段一：控制面瘦流转（Control Plane）—— 全程只传 64–200 B 轻量 BlobRef，零大字节进 Shuffle</text>

  <!-- Step 1.1: Scan & Pruning -->
  <rect x="38" y="56" width="290" height="120" class="card-b"/>
  <text x="52" y="76" class="t-h">1. 元数据扫描与前置裁剪</text>
  <text x="52" y="95" class="t-m">Projection Pruning + ZoneMap</text>
  <text x="52" y="114" class="t-s">• 过滤时间/租户/文件大小/MIME</text>
  <text x="52" y="131" class="t-s">• 零对象存储 GET，先裁掉 80%+ 无效行</text>
  <text x="52" y="148" class="t-s">• 若仅查标量，完全跳过 .blob 文件</text>
  <text x="52" y="165" class="t-tag-b">输出：Arrow Batch (id, meta, blob_ref)</text>

  <path d="M 328 116 L 368 116" class="arr-b" marker-end="url(#m-b)"/>

  <!-- Step 1.2: Ref-Only Narrow Shuffle -->
  <rect x="374" y="56" width="330" height="120" class="card-b"/>
  <text x="388" y="76" class="t-h">2. 控制面“瘦 Shuffle”与亲和路由</text>
  <text x="388" y="95" class="t-m">JOIN / Repartition / StickyExchange</text>
  <text x="388" y="114" class="t-s">• 仅重排标量键 + BlobRef，流量锐减 10⁴–10⁵×</text>
  <text x="388" y="131" class="t-s">• 文件亲和哈希：同 .blob 侧车行路由到同节点</text>
  <text x="388" y="148" class="t-s">• 前缀亲和路由：同 Prompt 前缀聚簇保 KV-Cache</text>
  <text x="388" y="165" class="t-tag-b">彻底隔离传统 Hash/Sort 内存池与大字节</text>

  <path d="M 704 116 L 744 116" class="arr-b" marker-end="url(#m-b)"/>

  <!-- Step 1.3: Byte-Weighted Split & Skew Governance -->
  <rect x="750" y="56" width="332" height="120" class="card-o"/>
  <text x="764" y="76" class="t-h">3. 字节加权切分与大小文件倾斜治理</text>
  <text x="764" y="95" class="t-m">Bin-Packing(blob_ref.length)</text>
  <text x="764" y="114" class="t-s">• 小文件倾斜（5 KB×百万）：Split 合并打包</text>
  <text x="764" y="131" class="t-s">• 大文件倾斜（4 GB 视频）：单对象隔离独占</text>
  <text x="764" y="148" class="t-s">• 对象内逻辑切片：按 GOP/页码拆 Sub-Range</text>
  <text x="764" y="165" class="t-tag-o">目标：每 Worker 负载字节均衡，消灭长尾</text>

  <!-- Vertical arrow from Control Plane to Data Plane -->
  <path d="M 916 176 L 916 208 L 190 208 L 190 232" class="arr-g" marker-end="url(#m-g)"/>
  <rect x="370" y="196" width="380" height="22" class="pill"/>
  <text x="560" y="211" text-anchor="middle" class="t-h">仅幸存 BlobRef 进入物化边界（携带 Credential Vending 临时凭据）</text>

  <!-- ZONE 2: Data Plane (Async Prefetch, Coalescing & Multi-Tier Cache) -->
  <rect x="20" y="236" width="1080" height="196" class="zone-data"/>
  <text x="38" y="260" class="hdr-g">阶段二：数据面按需拉取与多级缓冲（Data Plane）—— 削减对象存储 QPS/Cost，隐藏 20–80 ms 访问延迟</text>

  <!-- Step 2.1: Object Storage + Coalescing Prefetcher -->
  <rect x="38" y="274" width="320" height="142" class="card-s"/>
  <text x="52" y="294" class="t-h">4. 异步预取 + Range 合并读 + QPS 整形</text>
  <text x="52" y="313" class="t-m">Async Object-IO Pool (tokio / io_uring)</text>
  <text x="52" y="332" class="t-s">• Range Coalescing：合并同 .blob 碎区间</text>
  <text x="64" y="348" class="t-s">（Gap≤256 KiB, 块上限 8–16 MiB → QPS 降 10–100×）</text>
  <text x="52" y="366" class="t-s">• Partial Seek：视频/PDF 按需拉关键帧与目录</text>
  <text x="52" y="383" class="t-s">• 令牌桶流控 + 指数退避，避开 503 SlowDown</text>
  <text x="52" y="402" class="t-tag-g">S3 / GCS / OSS（TTFB 20–80 ms，并发预取掩盖）</text>

  <path d="M 358 345 L 398 345" class="arr-g" marker-end="url(#m-g)"/>

  <!-- Step 2.2: Multi-tier Local Cache -->
  <rect x="404" y="274" width="320" height="142" class="card-g"/>
  <text x="418" y="294" class="t-h">5. 本地内存 + NVMe SSD 多级缓存</text>
  <text x="418" y="313" class="t-m">L1 Pinned RAM → L2 Local NVMe Cache</text>
  <text x="418" y="332" class="t-s">• L1：固定字节配额环形缓冲，直喂解码器</text>
  <text x="418" y="349" class="t-s">• L2：本地 NVMe（2–7 GB/s，延迟 &lt; 0.2 ms）</text>
  <text x="418" y="366" class="t-s">• 配合上层亲和哈希：多 Epoch 训练与多模型</text>
  <text x="430" y="382" class="t-s">复用（一次解析多处消费）直接本地命中</text>
  <text x="418" y="402" class="t-tag-g">省掉重复对象存储 GET API 费与跨 AZ 流量费</text>

  <path d="M 724 345 L 764 345" class="arr-g" marker-end="url(#m-g)"/>

  <!-- Step 2.3: Bounded Byte Backpressure & Streaming -->
  <rect x="770" y="274" width="312" height="142" class="card-o"/>
  <text x="784" y="294" class="t-h">6. 大对象流式通道与字节上限控制</text>
  <text x="784" y="313" class="t-m">Byte-Budget Semaphore（非行数队列）</text>
  <text x="784" y="332" class="t-s">• 严控每节点在途总字节（如 4 GiB 上限）</text>
  <text x="784" y="349" class="t-s">• 超阈值巨对象（&gt;128 MB）禁止整块进内存：</text>
  <text x="796" y="365" class="t-s">以 BlobFile / BufferedIO 流式分块读取</text>
  <text x="784" y="383" class="t-s">• 跨节点传派生大 Tensor 走独立 OOB 通道</text>
  <text x="784" y="402" class="t-tag-o">杜绝 PDF/视频解码 20× 内存膨胀引发 OOM</text>

  <!-- Vertical arrow to Zone 3 -->
  <path d="M 926 416 L 926 446 L 260 446 L 260 468" class="arr-p" marker-end="url(#m-p)"/>

  <!-- ZONE 3: Compute & GPU Inference Feeding Loop -->
  <rect x="20" y="472" width="1080" height="130" class="zone-gpu"/>
  <text x="38" y="496" class="hdr-p">阶段三：异构流水线解耦（CPU 解码 × GPU 推理）—— 深度预取 + 拥塞反压，持续喂饱 GPU 显存算力</text>

  <!-- Step 3.1: CPU Decode Pool -->
  <rect x="38" y="508" width="440" height="78" class="card-p"/>
  <text x="52" y="528" class="t-h">7. 独立 CPU/NVDEC 多模态解码与预处理池</text>
  <text x="52" y="546" class="t-s">• 与 I/O 池、GPU 推理池物理隔离：JPEG/MP4/PDF 解码、Resize、Chunking</text>
  <text x="52" y="564" class="t-s">• 同机跨进程走 POSIX Shared Memory (Arrow IPC) 零拷贝交接 Tensor</text>
  <text x="52" y="580" class="t-m">预解码 2–4 个 Micro-Batch 提前就绪，彻底掩盖网络与解码抖动</text>

  <path d="M 478 547 L 528 547" class="arr-p" marker-end="url(#m-p)"/>

  <!-- Step 3.2: GPU Inference Pool -->
  <rect x="534" y="508" width="548" height="78" class="card-p"/>
  <text x="548" y="528" class="t-h">8. GPU 连续批推理池（vLLM / SGLang / Multimodal VLM）+ Row-Key 容错</text>
  <text x="548" y="546" class="t-s">• 按前缀粘性路由吃满 Prefix KV-Cache；Guided Decoding 强类型落回 Arrow STRUCT</text>
  <text x="548" y="564" class="t-s">• 上行反馈 TTFT / KV 水位驱动 AIMD 调并发；异步 Key 级 Checkpoint 免疫 Spot 抢占</text>
  <text x="548" y="580" class="t-m">结果 + 原 BlobRef 原子写回统一开放表（Lance / Paimon / Iceberg）</text>

  <!-- Backpressure feedback arrow from Zone 3 back up to Zone 2 -->
  <path d="M 1050 508 L 1050 452 L 560 452 L 560 418" class="arr-bp" marker-end="url(#m-o)"/>
  <text x="805" y="446" text-anchor="middle" class="t-tag-o">▲ 逐跳字节背压 &amp; GPU 拥塞反馈（TTFT / KV 水位高时自动降速 Prefetch）</text>
</svg>
