<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">Cindy 客户端架构与状态归属</title><desc id="desc">Renderer 通过 preload IPC 到 Main，Main 装配 Maker 和 Agent，引擎调用上游模型，宿主保存产品状态。手机和可选服务在宿主侧接线。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657b"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f6f8fc"/><g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" fill="#203149"><text x="40" y="48" font-size="28" font-weight="700" fill="#203149">Cindy：客户端、运行时与上游模型</text><rect x="40" y="90" width="310" height="145" rx="12" fill="#eaf0fb" stroke="#b8c7db"/><text x="62" y="125" font-size="22" font-weight="650" fill="#203149">Renderer / React</text><text x="62" y="158" font-size="17" font-weight="400" fill="#405570">消息、模型选择、队列投影</text><text x="62" y="185" font-size="17" font-weight="400" fill="#405570">布局、设置与可重建缓存</text><text x="62" y="212" font-size="17" font-weight="400" fill="#405570">提交意图，不持有真实密钥</text><rect x="420" y="90" width="300" height="145" rx="12" fill="#eaf0fb" stroke="#b8c7db"/><text x="442" y="125" font-size="22" font-weight="650" fill="#203149">preload / IPC</text><text x="442" y="158" font-size="17" font-weight="400" fill="#405570">窄接口与跨进程协议</text><text x="442" y="185" font-size="17" font-weight="400" fill="#405570">Main 验证来源及参数</text><text x="442" y="212" font-size="17" font-weight="400" fill="#405570">不把通用系统权限交给 UI</text><rect x="790" y="90" width="370" height="145" rx="12" fill="#eaf0fb" stroke="#b8c7db"/><text x="812" y="125" font-size="22" font-weight="650" fill="#203149">Main / Electron 宿主</text><text x="812" y="158" font-size="17" font-weight="400" fill="#405570">窗口、进程、权限与持久化</text><text x="812" y="185" font-size="17" font-weight="400" fill="#405570">maker-host / maker-ipc</text><text x="812" y="212" font-size="17" font-weight="400" fill="#405570">可选服务、远程与原生助手</text><path d="M350 160 H420" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M720 160 H790" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M970 235 V280 H330 V320" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="530" y="270" font-size="16" font-weight="400" fill="#405570">注入认证、工具、存储与生命周期钩子</text><rect x="40" y="320" width="570" height="190" rx="12" fill="#eaf0fb" stroke="#b8c7db"/><text x="62" y="355" font-size="22" font-weight="650" fill="#203149">maker-core：Maker + Session</text><text x="62" y="388" font-size="17" font-weight="400" fill="#405570">Maker：注册 Agent、创建与清理 Session</text><text x="62" y="415" font-size="17" font-weight="400" fill="#405570">Session：轮次预留、派发、权限与事件流</text><text x="62" y="442" font-size="17" font-weight="400" fill="#405570">输入事务由 Main 的 AgentInputCoordinator 协调</text><text x="62" y="469" font-size="17" font-weight="400" fill="#405570">产品任务 ID 与原生引擎会话 ID 分开</text><rect x="680" y="320" width="480" height="190" rx="12" fill="#eaf0fb" stroke="#b8c7db"/><text x="702" y="355" font-size="22" font-weight="650" fill="#203149">Agent 实现与原生运行时</text><text x="702" y="388" font-size="17" font-weight="400" fill="#405570">Claude Code / Codex / Pi</text><text x="702" y="415" font-size="17" font-weight="400" fill="#405570">统一 handle，保留各自能力与协议</text><text x="702" y="442" font-size="17" font-weight="400" fill="#405570">本地 CLI 或受控远程执行</text><text x="702" y="469" font-size="17" font-weight="400" fill="#405570">模型推理位置由选中的供应商决定</text><path d="M610 410 H680" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M230 510 V595" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="248" y="555" font-size="16" font-weight="400" fill="#405570">宿主存储适配</text><rect x="40" y="595" width="410" height="165" rx="12" fill="#e8f3ef" stroke="#b8c7db"/><text x="62" y="630" font-size="22" font-weight="650" fill="#203149">SQLite 与其他持久数据</text><text x="62" y="663" font-size="17" font-weight="400" fill="#405570">任务、消息、模型和原生会话关联</text><text x="62" y="690" font-size="17" font-weight="400" fill="#405570">Agent 原生历史另有生命周期</text><text x="62" y="717" font-size="17" font-weight="400" fill="#405570">凭证、附件、记忆分属不同存储合同</text><path d="M920 510 V595" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="938" y="555" font-size="16" font-weight="400" fill="#405570">协议适配与供应商选路</text><rect x="520" y="595" width="640" height="165" rx="12" fill="#fff2df" stroke="#b8c7db"/><text x="542" y="630" font-size="22" font-weight="650" fill="#203149">上游模型服务 / 独立服务端</text><text x="542" y="663" font-size="17" font-weight="400" fill="#405570">目录、协议、鉴权与账号准入分别校验</text><text x="542" y="690" font-size="17" font-weight="400" fill="#405570">Codex 可经本地 Responses → Messages 桥</text><text x="542" y="717" font-size="17" font-weight="400" fill="#405570">Pi 按来源选择原生供应商或宿主代理</text><text x="542" y="744" font-size="17" font-weight="400" fill="#405570">Mobile / device-link 控制执行电脑，非另一份本地引擎</text><text x="40" y="808" font-size="16" font-weight="400" fill="#596b81">范围：客户端源码；云服务端实现未在本次分析中审计。</text></g></svg>