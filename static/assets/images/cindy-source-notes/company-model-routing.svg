<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">公司模型的 Codex 与 Pi 调用和凭证路径</title><desc id="desc">Codex 使用回环桥及占位鉴权，由 Main 注入真实凭证；Pi 自定义 API key 路径由 Main 读取凭证并交给 Pi 子进程环境，Pi 原生协议访问上游。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657b"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#f6f8fc"/><g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" fill="#203149"><text x="35" y="48" font-size="28" font-weight="700" fill="#203149">同一模型，两条引擎路径</text><text x="35" y="80" font-size="17" font-weight="400" fill="#596b81">本次 API key 个人构建；不泛化到订阅账号或其他供应商分支。</text><rect x="35" y="125" width="245" height="130" rx="12" fill="#eaf0fb" stroke="#b8c7db"/><text x="57" y="160" font-size="22" font-weight="650" fill="#203149">Codex CLI</text><text x="57" y="193" font-size="17" font-weight="400" fill="#405570">本地 Responses 请求</text><text x="57" y="220" font-size="17" font-weight="400" fill="#405570">持有合成占位鉴权值</text><rect x="360" y="125" width="435" height="130" rx="12" fill="#eaf0fb" stroke="#b8c7db"/><text x="382" y="160" font-size="22" font-weight="650" fill="#203149">Main：回环桥与路由</text><text x="382" y="193" font-size="17" font-weight="400" fill="#405570">Responses → Anthropic Messages</text><text x="382" y="220" font-size="17" font-weight="400" fill="#405570">读取真实 key；按供应商处理请求头</text><path d="M280 190 H360" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="35" y="345" width="245" height="130" rx="12" fill="#eaf0fb" stroke="#b8c7db"/><text x="57" y="380" font-size="22" font-weight="650" fill="#203149">Pi 原生运行时</text><text x="57" y="413" font-size="17" font-weight="400" fill="#405570">Anthropic Messages</text><text x="57" y="440" font-size="17" font-weight="400" fill="#405570">密钥由环境变量提供</text><rect x="360" y="345" width="435" height="130" rx="12" fill="#eaf0fb" stroke="#b8c7db"/><text x="382" y="380" font-size="22" font-weight="650" fill="#203149">Main：原生 Provider 装配</text><text x="382" y="413" font-size="17" font-weight="400" fill="#405570">readKey → env[apiKeyEnvVar]</text><text x="382" y="440" font-size="17" font-weight="400" fill="#405570">协议、base URL、型号交给 Pi</text><path d="M360 410 H280" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="386" y="329" font-size="16" font-weight="400" fill="#405570">启动配置与密钥环境</text><rect x="920" y="225" width="245" height="150" rx="12" fill="#fff2df" stroke="#b8c7db"/><text x="942" y="260" font-size="22" font-weight="650" fill="#203149">公司模型服务</text><text x="942" y="293" font-size="17" font-weight="400" fill="#405570">DeepSeek V4.1 Flash</text><text x="942" y="320" font-size="17" font-weight="400" fill="#405570">HTTPS 模型推理</text><text x="942" y="347" font-size="17" font-weight="400" fill="#405570">实际域名不写入文章</text><path d="M795 190 H855 V260 H920" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="803" y="170" font-size="16" font-weight="400" fill="#405570">真实上游请求</text><path d="M155 475 V515 H855 V340 H920" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)"/><text x="555" y="540" font-size="16" font-weight="400" fill="#405570">Pi 发起原生模型请求</text><rect x="360" y="575" width="435" height="75" rx="12" fill="#e8f3ef" stroke="#b8c7db"/><text x="382" y="610" font-size="22" font-weight="650" fill="#203149">既有 OpenCode 凭证源</text><path d="M510 575 V545 H320 V290 H515 V255" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M660 575 V550 H825 V500 H660 V475" fill="none" stroke="#52657b" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="35" y="628" font-size="17" font-weight="400" fill="#596b81">实线：调用或配置交付</text><text x="35" y="654" font-size="17" font-weight="400" fill="#596b81">虚线：Main 读取凭证来源</text></g></svg>