<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 860" role="img" aria-labelledby="title desc"><title id="title">Direct Bailian PoC: keep the native UI</title><desc id="desc">A process-scoped route replaces cloud inference and translates Bailian deltas into native Warp events.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#526477"/></marker></defs><rect width="1040" height="860" rx="18" fill="#f6f8fb"/><g font-family="system-ui,-apple-system,sans-serif" fill="#183047"><text x="40" y="43" font-size="27" font-weight="700">Direct Bailian PoC: keep the native UI</text><rect x="40" y="85" width="450" height="125" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="60" y="119" font-size="22" font-weight="650">1. Native input + Controller</text><text x="60" y="149" font-size="18">New local text conversation</text><text x="60" y="176" font-size="18">No files, attachments or tool results</text><rect x="550" y="85" width="450" height="125" rx="12" fill="#e5f3ee" stroke="#becbda" stroke-width="1.5"/><text x="570" y="119" font-size="22" font-weight="650">6. Native history + UI</text><text x="570" y="149" font-size="18">AIHistoryModel / AIConversation / AIBlock</text><text x="570" y="176" font-size="18">Same native input and streaming display</text><path d="M265 210 V270" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M775 270 V210" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="270" width="450" height="125" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="60" y="304" font-size="22" font-weight="650">2. Explicit direct request snapshot</text><text x="60" y="334" font-size="18">WARP_DIRECT_BAILIAN=1</text><text x="60" y="361" font-size="18">DirectBailianRequest → RequestParams</text><rect x="550" y="270" width="450" height="125" rx="12" fill="#e5f3ee" stroke="#becbda" stroke-width="1.5"/><text x="570" y="304" font-size="22" font-weight="650">5. Native event adapter</text><text x="570" y="334" font-size="18">Init → AddMessages → Append → Finished</text><text x="570" y="361" font-size="18">Stable IDs; no cloud conversation token</text><path d="M265 395 V455" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M775 455 V395" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="455" width="450" height="125" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="60" y="489" font-size="22" font-weight="650">3. warp_bailian_client</text><text x="60" y="519" font-size="18">Text history → OpenAI-compatible JSON</text><text x="60" y="546" font-size="18">No Warp auth or /ai/multi-agent call</text><rect x="550" y="455" width="450" height="125" rx="12" fill="#fff0db" stroke="#becbda" stroke-width="1.5"/><text x="570" y="489" font-size="22" font-weight="650">4. Bailian Token Plan</text><text x="570" y="519" font-size="18">deepseek-v4.1-flash</text><text x="570" y="546" font-size="18">HTTPS chat/completions → SSE deltas</text><path d="M490 520 H550" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><text x="498" y="498" font-size="17" fill="#4c6074">TLS</text><rect x="40" y="650" width="960" height="130" rx="12" fill="#efebfa" stroke="#becbda" stroke-width="1.5"/><text x="60" y="684" font-size="22" font-weight="650">DirectBailian conversation driver</text><text x="60" y="714" font-size="18">Owns turn lifecycle; tools OFF; task status reporting OFF; persistence OFF</text><text x="60" y="741" font-size="18">Errors terminate the turn. No automatic retry, cloud recovery or provider fallback.</text><text x="40" y="822" font-size="17" fill="#4c6074">Inference is direct. Normal GUI login and the Agent settings gate still apply in this PoC.</text></g></svg>