<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 890" role="img" aria-labelledby="title desc"><title id="title">Native Agent: request down, response up</title><desc id="desc">The default client sends provider configuration to Warp cloud and applies native response events to local history.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#526477"/></marker></defs><rect width="1040" height="890" rx="18" fill="#f6f8fb"/><g font-family="system-ui,-apple-system,sans-serif" fill="#183047"><text x="40" y="43" font-size="27" font-weight="700">Native Agent: request down, response up</text><rect x="40" y="85" width="450" height="125" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="60" y="119" font-size="22" font-weight="650">1. Native input</text><text x="60" y="149" font-size="18">Input::input_enter</text><text x="60" y="176" font-size="18">submit_ai_query_with_routing</text><rect x="550" y="85" width="450" height="125" rx="12" fill="#e5f3ee" stroke="#becbda" stroke-width="1.5"/><text x="570" y="119" font-size="22" font-weight="650">8. Native Agent view</text><text x="570" y="149" font-size="18">AIBlock::render</text><text x="570" y="176" font-size="18">Streaming text + follow-up input</text><path d="M265 210 V270" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M775 270 V210" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="270" width="450" height="125" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="60" y="304" font-size="22" font-weight="650">2. Availability + routing</text><text x="60" y="334" font-size="18">AIRequestUsageModel / PromptAlert</text><text x="60" y="361" font-size="18">BlocklistAIController::send_query</text><rect x="550" y="270" width="450" height="125" rx="12" fill="#e5f3ee" stroke="#becbda" stroke-width="1.5"/><text x="570" y="304" font-size="22" font-weight="650">7. Local history + conversation</text><text x="570" y="334" font-size="18">apply_client_actions / apply_client_action</text><text x="570" y="361" font-size="18">AddMessages / AppendToMessageContent</text><path d="M265 395 V455" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M775 455 V395" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="455" width="450" height="125" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="60" y="489" font-size="22" font-weight="650">3. Request snapshot</text><text x="60" y="519" font-size="18">RequestInput / RequestParams</text><text x="60" y="546" font-size="18">Models, tasks, context, provider credentials</text><rect x="550" y="455" width="450" height="125" rx="12" fill="#e5f3ee" stroke="#becbda" stroke-width="1.5"/><text x="570" y="489" font-size="22" font-weight="650">6. ResponseStream + Controller</text><text x="570" y="519" font-size="18">SSE → Base64 → protobuf ResponseEvent</text><text x="570" y="546" font-size="18">apply_response_event</text><path d="M265 580 V640" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M775 640 V580" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="640" width="450" height="125" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="60" y="674" font-size="22" font-weight="650">4. Native request conversion</text><text x="60" y="704" font-size="18">api/impl::generate_multi_agent_output</text><text x="60" y="731" font-size="18">warp_multi_agent_api::Request</text><rect x="550" y="640" width="450" height="125" rx="12" fill="#ffe9e6" stroke="#becbda" stroke-width="1.5"/><text x="570" y="674" font-size="22" font-weight="650">5. Warp cloud Agent endpoint</text><text x="570" y="704" font-size="18">warp_multi_agent_client → HTTP POST</text><text x="570" y="731" font-size="18">/ai/multi-agent</text><path d="M490 703 H550" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><text x="503" y="682" font-size="17" fill="#4c6074">TLS</text><text x="40" y="814" font-size="17" fill="#4c6074">Custom provider endpoint ≠ direct client inference. The cloud implementation is outside this trace.</text><text x="40" y="849" font-size="17" fill="#4c6074">Tool execution adds a follow-up loop after response actions; this diagram focuses on one request.</text></g></svg>