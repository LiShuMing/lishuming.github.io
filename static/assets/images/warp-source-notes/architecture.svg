<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1020" role="img" aria-labelledby="title desc"><title id="title">Warp: frontends, state and execution</title><desc id="desc">GUI and TUI share core entities. Local PTY lifecycle is separate from the cloud Agent API.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#526477"/></marker></defs><rect width="1040" height="1020" rx="18" fill="#f6f8fb"/><g font-family="system-ui,-apple-system,sans-serif" fill="#183047"><text x="40" y="43" font-size="27" font-weight="700">Warp: frontends, state and execution</text><rect x="40" y="80" width="450" height="125" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="60" y="114" font-size="22" font-weight="650">GUI desktop</text><text x="60" y="144" font-size="18">app/ + WarpUI elements</text><text x="60" y="171" font-size="18">Pixel layout / GPU / macOS Metal</text><rect x="550" y="80" width="450" height="125" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="570" y="114" font-size="22" font-weight="650">Headless TUI</text><text x="570" y="144" font-size="18">crates/warp_tui/</text><text x="570" y="171" font-size="18">Cell grid / terminal input</text><path d="M265 205 V250" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M775 205 V250" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="250" width="960" height="130" rx="12" fill="#e5f3ee" stroke="#becbda" stroke-width="1.5"/><text x="60" y="284" font-size="22" font-weight="650">Shared application state</text><text x="60" y="314" font-size="18">App / AppContext / Entity / ModelHandle / ViewHandle</text><text x="60" y="341" font-size="18">Actions, subscriptions and notifications connect model updates to views</text><path d="M265 380 V435" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M775 380 V435" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="435" width="450" height="160" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="60" y="469" font-size="22" font-weight="650">Terminal surface</text><text x="60" y="499" font-size="18">Input / session / command blocks</text><text x="60" y="526" font-size="18">PTY event loop / ANSI + DCS / grid</text><text x="60" y="553" font-size="18">app/src/terminal + warp_terminal</text><rect x="550" y="435" width="450" height="160" rx="12" fill="#e8f0fc" stroke="#becbda" stroke-width="1.5"/><text x="570" y="469" font-size="22" font-weight="650">Native Agent surface</text><text x="570" y="499" font-size="18">Controller / task / conversation</text><text x="570" y="526" font-size="18">ResponseStream / history / actions</text><text x="570" y="553" font-size="18">app/src/ai + multi-agent protocol</text><path d="M155 595 V665" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M375 595 V665" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M775 595 V665" fill="none" stroke="#526477" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="55" y="614" width="147" height="25" fill="#f6f8fb"/><text x="58" y="633" font-size="17" fill="#4c6074">create / lifecycle</text><rect x="317" y="614" width="91" height="25" fill="#f6f8fb"/><text x="320" y="633" font-size="17" fill="#4c6074">bytes / fd</text><rect x="40" y="665" width="215" height="120" rx="12" fill="#fff0db" stroke="#becbda" stroke-width="1.5"/><text x="60" y="699" font-size="22" font-weight="650">TerminalServer</text><text x="60" y="729" font-size="18">Local subprocess</text><text x="60" y="756" font-size="18">PTY management</text><rect x="285" y="665" width="205" height="120" rx="12" fill="#fff0db" stroke="#becbda" stroke-width="1.5"/><text x="305" y="699" font-size="22" font-weight="650">PTY + shell</text><text x="305" y="729" font-size="18">Child processes</text><text x="305" y="756" font-size="18">Commands</text><rect x="550" y="665" width="450" height="120" rx="12" fill="#ffe9e6" stroke="#becbda" stroke-width="1.5"/><text x="570" y="699" font-size="22" font-weight="650">Warp cloud Agent API</text><text x="570" y="729" font-size="18">POST /ai/multi-agent</text><text x="570" y="756" font-size="18">Provider config + tasks + tool capabilities</text><rect x="40" y="855" width="450" height="110" rx="12" fill="#efebfa" stroke="#becbda" stroke-width="1.5"/><text x="60" y="889" font-size="22" font-weight="650">Local persistence</text><text x="60" y="919" font-size="18">SQLite / Diesel / restore conditions</text><rect x="550" y="855" width="450" height="110" rx="12" fill="#efebfa" stroke="#becbda" stroke-width="1.5"/><text x="570" y="889" font-size="22" font-weight="650">Account and cloud features</text><text x="570" y="919" font-size="18">Auth / Drive / GraphQL / settings</text><text x="40" y="824" font-size="17" fill="#4c6074">Cross-cutting services: each has its own state and network boundary.</text><text x="40" y="997" font-size="17" fill="#4c6074">Source baseline: 1e6c3ae465d6 | Local PTY server and cloud Agent server have different roles.</text></g></svg>