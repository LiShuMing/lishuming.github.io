<svg xmlns="http://www.w3.org/2000/svg" width="720" height="550" viewBox="0 0 720 550" role="img" aria-labelledby="title desc">
<title id="title">64K 配置下长输入测试的可用物理内存</title>
<desc id="desc">2026 年 10 月 8 日两次串行长输入测试，共 15 个实际采样点。主机可用物理内存从 5.002 GiB 降到最低 0.015 GiB；最低值发生在 39992 token 输入的 prefill。纵轴为 GiB，横轴为首次采样起经过秒数。连线不表示新增采样。数据为整机状态，不表示已发生 OOM。</desc>
