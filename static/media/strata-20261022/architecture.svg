<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">Strata 的服务边界与分层推理路径</title>
  <desc id="desc">WSL 客户端经本机 HTTP 调用 Windows Python 服务。服务管理常驻 C++ 引擎。decode 的 GPU 热专家与 CPU 未命中专家并行计算并汇合。SSD 为 n-gram 和未驻留专家提供不同读取路径。本图不表示 prefill 的全部数据流。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#152d43;font-size:24px}.sub{font-size:22px;fill:#41576c}.heading{font-size:28px;font-weight:700}.flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="720" height="1080" fill="#f8fafc"/>
  <text x="360" y="48" text-anchor="middle" class="heading">Strata 的分层推理路径</text>
  <rect x="100" y="78" width="520" height="112" rx="12" fill="#e8eef8"/>
  <text x="360" y="120" text-anchor="middle">WSL 开发与评测客户端</text>
  <text x="360" y="158" text-anchor="middle" class="sub">OpenCode · 代码审查 · benchmark</text>
  <path class="flow" d="M360 190V242"/>
  <text x="376" y="225" class="sub">HTTP · 127.0.0.1:8080</text>
  <rect x="100" y="250" width="520" height="122" rx="12" fill="#e7f1f5"/>
  <text x="360" y="292" text-anchor="middle">Windows · Python Service</text>
  <text x="360" y="328" text-anchor="middle" class="sub">模板与 tokenization · 串行队列</text>
  <path class="flow" d="M360 372V422"/>
  <text x="376" y="405" class="sub">命令与 token IDs</text>
  <rect x="100" y="430" width="520" height="124" rx="12" fill="#dcece7"/>
  <text x="360" y="473" text-anchor="middle">常驻 C++ 引擎</text>
  <text x="360" y="511" text-anchor="middle" class="sub">路由分类 → 两侧计算 → 层内汇合</text>
  <path class="flow" d="M250 554V600"/>
  <path class="flow" d="M510 554V600"/>
  <rect x="100" y="608" width="250" height="170" rx="12" fill="#e0edf8"/>
  <text x="225" y="649" text-anchor="middle" class="heading">GPU VRAM</text>
  <text x="225" y="692" text-anchor="middle">热专家命中</text>
  <text x="225" y="733" text-anchor="middle" class="sub">KV · MTP · dense</text>
  <rect x="380" y="608" width="240" height="170" rx="12" fill="#f4ead8"/>
  <text x="500" y="649" text-anchor="middle" class="heading">CPU + RAM</text>
  <text x="500" y="692" text-anchor="middle">计算 miss 专家</text>
  <text x="500" y="733" text-anchor="middle" class="sub">部分补集锁页</text>
  <path class="flow" d="M500 859V786"/>
  <text x="484" y="827" text-anchor="end" class="sub">未驻留专家的文件后备</text>
  <rect x="100" y="866" width="520" height="116" rx="12" fill="#ece9f6"/>
  <text x="360" y="907" text-anchor="middle" class="heading">NVMe SSD</text>
  <text x="360" y="946" text-anchor="middle" class="sub">n-gram lookup · GGUF · pack</text>
  <path class="flow" d="M100 920H49V490H92"/>
  <text x="29" y="737" transform="rotate(-90 29 737)" text-anchor="middle" class="sub">n-gram 异步读取</text>
  <text x="360" y="1023" text-anchor="middle" class="sub">重点展示 decode 分工；prefill 批量路径见正文。</text>
  <text x="360" y="1055" text-anchor="middle" class="sub">源码版本：82f46a8 · 单卡文本路径</text>
</svg>
