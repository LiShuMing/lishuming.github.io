{{ define "main" }}
<h2>{{ .Title }}</h2>
<ul class="listing">
{{ range .Pages }}
  <li class="listing-item">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    <a href="{{ .RelPermalink }}" title="{{ .Title }}">{{ .Title }}</a>
  </li>
{{ end }}
</ul>
{{ end }}
