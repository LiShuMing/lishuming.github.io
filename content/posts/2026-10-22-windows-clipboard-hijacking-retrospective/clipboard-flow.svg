<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">来源应用写入后，后台进程仍可改写共享剪贴板</title>
  <desc id="desc">来源应用先写入原文A，后台进程读取并替换共享剪贴板为B，目标应用粘贴时读到B。绕开微信直接写入仍触发篡改，暂停可疑进程后90次采样保持一致。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#526a84"/></marker><marker id="redarrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#bb573b"/></marker></defs>
  <rect width="1000" height="570" rx="20" fill="#f4f7fb"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172b45">
    <text x="38" y="55" font-size="28" font-weight="700">复制与粘贴之间，还有一个共享状态</text>
    <text x="38" y="88" font-size="18" fill="#50657c">观察到内容改写，并不自动等于来源应用或编辑器出错。</text>
    <rect x="38" y="140" width="244" height="104" rx="12" fill="#dce9f9"/>
    <text x="160" y="181" text-anchor="middle" font-size="23" font-weight="700">来源应用</text>
    <text x="160" y="216" text-anchor="middle" font-size="19">微信 / 测试脚本</text>
    <rect x="376" y="140" width="248" height="104" rx="12" fill="#fff" stroke="#7b95b2" stroke-width="2"/>
    <text x="500" y="181" text-anchor="middle" font-size="23" font-weight="700">系统剪贴板</text>
    <text x="500" y="216" text-anchor="middle" font-size="20">内容 A → 内容 B</text>
    <rect x="718" y="140" width="244" height="104" rx="12" fill="#dce9f9"/>
    <text x="840" y="181" text-anchor="middle" font-size="23" font-weight="700">目标应用</text>
    <text x="840" y="216" text-anchor="middle" font-size="19">Sublime Text 等</text>
    <path d="M286 192 H362" fill="none" stroke="#526a84" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="326" y="173" text-anchor="middle" font-size="17">写 A</text>
    <path d="M630 192 H704" fill="none" stroke="#526a84" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="668" y="173" text-anchor="middle" font-size="17">读 B</text>
    <rect x="330" y="325" width="340" height="95" rx="12" fill="#ffe4d9" stroke="#ce6745" stroke-width="2"/>
    <text x="500" y="364" text-anchor="middle" font-size="23" font-weight="700">后台篡改进程</text>
    <text x="500" y="397" text-anchor="middle" font-size="19">识别片段 → 替换为固定地址</text>
    <path d="M445 250 V310" fill="none" stroke="#bb573b" stroke-width="3" marker-end="url(#redarrow)"/>
    <text x="420" y="286" text-anchor="end" font-size="18" fill="#9a442d">读取</text>
    <path d="M555 321 V259" fill="none" stroke="#bb573b" stroke-width="3" marker-end="url(#redarrow)"/>
    <text x="578" y="286" font-size="18" fill="#9a442d">改写</text>
    <text x="38" y="480" font-size="21" font-weight="700">对照 1：绕过微信直接写入，仍约 100 ms 内变化。</text>
    <text x="38" y="519" font-size="21" font-weight="700">对照 2：暂停该进程，微信与搜狗仍运行，90 / 90 保持一致。</text>
  </g>
</svg>
