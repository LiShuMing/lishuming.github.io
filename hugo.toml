baseURL = 'https://lishuming.github.io/'
languageCode = 'zh-CN'
title = 'Vipassana'
author = 'LiShuMing'
description = '源码、实验与随笔'
theme = 'aphasia'

[params]
  author = 'LiShuMing'
  description = '源码、实验与随笔'

[menu]
  [[menu.main]]
    name = 'HOME'
    url = '/'
    weight = 10
  [[menu.main]]
    name = 'CATEGORIES'
    url = '/categories/'
    weight = 20
  [[menu.main]]
    name = 'TAGS'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    name = 'ABOUT'
    url = '/about/'
    weight = 50
  [[menu.main]]
    name = 'RSS'
    url = '/index.xml'
    weight = 60

[pagination]
  pagerSize = 16

[permalinks]
  posts = '/:year/:month/:day/:slug/'

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    lineNos = true
    lineNumbersInTable = false
    noClasses = true
    style = 'monokai'
    tabWidth = 4

[taxonomies]
  tag = 'tags'
  category = 'categories'
